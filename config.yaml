podcast_name: "Notecast"
podcast_tagline: "AI-generated research episodes"

research:
  max_results: 5        # Tavily results per question
  search_depth: advanced
  days: 90              # only return results published within this many days

llm:
  model: "anthropic/claude-sonnet-4-6"
  api_key_label: "ANTHROPIC_API_KEY"

tts:
  provider: "elevenlabs"  # elevenlabs | openai
  elevenlabs_voices:
    host1: "DODLEQrClDo8wCz460ld"  # Lauren — find IDs at elevenlabs.io/voice-library
    host2: "esrHspGYDSfkn5IuPYtJ"  # Erby
  elevenlabs_speed:
    host1: 1.2   # 0.7–1.2; applied during generation via VoiceSettings
    host2: 1.0
  openai_voices:
    host1: "onyx"   # onyx | echo | fable | alloy | shimmer
    host2: "nova"
  openai_speed:
    host1: 1.0   # 0.25–4.0
    host2: 1.0

script:
  word_count: 3000
  fact_check: true       # rewrite unsupported claims against the research brief
  conversation_style:
    - "informative"
    - "engaging"
  roles_person1: "lead researcher"
  roles_person2: "curious questioner"
  dialogue_structure:
    - "Introduction"
    - "Main Discussion"
    - "Key Insights"
    - "Conclusion"
  engagement_techniques:
    - "rhetorical questions"
    - "analogies"
    - "real-world examples"

intro_music:
  path: "assets/intro.mp3"
  overlap_ms: 2000    # music begins fading in this many ms before intro speech ends
  sting_ms: 15000      # music plays solo at full volume after intro ends (ms)
  fade_in_ms: 2500    # duration of music fade-in while overlapping speech (ms)
  fade_out_ms: 2000   # duration of music fade-out into the episode (ms)
  duck_db: 14         # dB reduction of music while speech is still playing

output_dir: "output"
